data_root_dir: /lustre/fsw/portfolios/healthcareeng/users/zhonglinc/conformer/data/geom/drugs_new/
checkpoint_dir: /lustre/fsw/portfolios/healthcareeng/users/zhonglinc/dit_pairwise_bias/checkpoints
run_name: dit_52.5M_drugs_withH_2GPU_maxn200_kabsch_ut_nosc #dit_52.5M_drugs_withH_2GPU_maxn200_avgflow_ut_nosc
eval_epoch: 100
unit: step # or epoch


use_ema: true
solver: tsit5 # tsit5 or euler
rtol: 1e-5 # only use when using tsit5 solver
atol: 1e-4 # only use when using tsit5 solver
only_save_last: false
n_ode_steps: 100 # not use when using tsit5 solver

model:
  batchsize: 64
  max_n: 200
  feat_dim: 75
  pe_dim: 32
  input_dim: 113 # 3+3+feat_dim+pe_dim
  node_dim: 512
  cond_dim: 512
  graph_feat_dim: 5
  n_edge_type: 5
  edge_type_emb_dim: 126 # 128-2
  n_heads: 16
  n_layers: 8
  n_registers: 10

flow_matcher:
  target_mode: avgflow
  loss_mode: ut
  self_cond: false
  learning_rate: 0.0001



