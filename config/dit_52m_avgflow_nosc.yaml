data_root_dir: /lustre/fsw/portfolios/healthcareeng/users/zhonglinc/conformer/data/geom/drugs_new/
checkpoint_dir: /lustre/fsw/portfolios/healthcareeng/users/zhonglinc/dit_pairwise_bias/checkpoints

model:
  batchsize: 80
  max_n: 200
  feat_dim: 75
  pe_dim: 32
  input_dim: 113 # 3+3+feat_dim+pe_dim
  node_dim: 512
  cond_dim: 512
  graph_feat_dim: 5
  n_edge_type: 5
  edge_type_emb_dim: 126 # 128-2
  n_heads: 16
  n_layers: 8
  n_registers: 10

flow_matcher:
  target_mode: avgflow
  loss_mode: ut
  self_cond: false
  learning_rate: 0.0001

training:
  ema_beta: 0.001
  n_epochs: 600
  save_every_n_epoch: [25, 20]
  save_interval_change_threshold: [300]
  log_every_n_step: 5

validation:
  val_every_n_epoch: 0
  n_val_samples: 1000


