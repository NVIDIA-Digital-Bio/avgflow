[project]
name = "avgflow"
version = "0.0.1"
description = "Code for AvgFlow"
authors = [
    {name = "Nvidia Corporation"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "numpy (==1.26.4)",
    "diffrax (==0.6.2)",
    "einops (==0.8.0)",
    "equinox (==0.11.11)",
    "einops (==0.8.0)",
    "flax (==0.10.2)",
    "jax (==0.5.0)",
    "optax (==0.2.4)",
    "jax-cuda12-pjrt (==0.5.0)",
    "jax-cuda12-plugin (==0.5.0)",
    "jaxlib (==0.5.0)",
    "jaxtyping (==0.2.38)",
    "tqdm (==4.67.1)",
    "pyyaml (==6.0.2)",
    "orbax-checkpoint (==0.11.2)",
    "networkx (==3.4.2)",
    "plotly (==6.0.0)",
    "rdkit (==2024.03.5)",
    "pandas (==2.2.3)",
    "scipy (==1.15.1)",
    "compress_pickle (==2.1.0)",
    "jraph (==0.0.6.dev0)",
    "pyyaml (==6.0.2)",
    "wandb (==0.19.6)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
bandit = "^1.8.6"
safety = "^3.6.0"

